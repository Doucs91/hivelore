name: hivelore-sync
on:
  push:
    branches: [main, master, develop]
  pull_request:
permissions:
  contents: read
jobs:
  memory-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - name: build hivelore from repo
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: inspect memory health (read only)
        shell: bash
        run: |
          set +e
          node packages/cli/dist/index.js memory verify --json > /tmp/hivelore-health.json
          status=$?
          set -e
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/hivelore-health.json","utf8")); if (!r.summary || r.error) process.exit(2); const stale=r.results.filter(x=>x.status==="stale"); console.log(stale.length ? stale.slice(0,5).map(x=>x.id+": "+x.reason).join("\n") : "No stale anchors detected. Anchor presence does not prove every claim.");' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hivelore-memory-health
          path: /tmp/hivelore-health.json
      - name: harness regression gate
        if: hashFiles('.ai/eval/baseline.json') != ''
        run: node packages/cli/dist/index.js eval --regression-gate
      - name: unconfigured regression gate
        if: hashFiles('.ai/eval/baseline.json') == ''
        run: echo "Regression gate not configured; no quality result claimed." >> "$GITHUB_STEP_SUMMARY"
  pr-memory-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: Doucs91/hivelore/packages/github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-memories: '5'
