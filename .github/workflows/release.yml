name: release

# Publish the four lockstep packages to npm when a version tag is pushed.
#
# The ONLY publish path (authorized by Sady, 2026-11-06): a version tag push builds, verifies and
# publishes. Nobody — agent or human — runs `npm publish` from a workstation, and no one handles the
# token outside the `npm-publish` environment.
#
# One-time setup (repo owner):
#   1. Settings → Environments: create `npm-publish`; restrict it to tags `v*.*.*`; add required
#      reviewers only if each publication should wait for a manual approval.
#   2. Add the environment secret NPM_TOKEN: an npm granular token (read+write on @hivelore, bypass
#      2FA, max 90 days — rotate it), or switch to npm trusted publishing (OIDC) and drop the token.
# Re-publish an existing tag: `gh workflow run release --ref vX.Y.Z`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.27.1). Defaults to the current ref."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # gates on manual approval — configure required reviewers
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Safety: the pushed tag (vX.Y.Z) must match the lockstep package version, so a stale tag
      # can never publish the wrong build. Skips the check for manual workflow_dispatch runs.
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      # Degrade gracefully: until the repo owner adds the NPM_TOKEN secret, this is a green no-op
      # rather than a red failure — so adding the workflow never breaks the pipeline. Once the secret
      # exists, the same tag push publishes for real.
      - name: Check npm credentials
        id: creds
        run: |
          if [ -n "${NPM_TOKEN}" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::NPM_TOKEN not set — skipping publish. Add the secret to enable release-on-tag."; fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build, test, and publish all packages
        if: steps.creds.outputs.ready == 'true'
        run: pnpm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
